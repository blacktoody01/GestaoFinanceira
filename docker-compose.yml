services:
  app:
    build: .
    container_name: gestaofinanceira_app
    restart: unless-stopped
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    env_file: .env
    environment:
      - PORT=3000
    ports:
      - "127.0.0.1:${EXTERNAL_PORT:-3003}:3000"
    networks:
      - soluaux_proxy

networks:
  soluaux_proxy:
    external: true
